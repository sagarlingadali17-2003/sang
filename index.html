<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Original QGIS2Web CSS Dependencies -->
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables for Glassmorphism & Dark Mode */
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --sidebar-width: 320px;
        }

        /* Base Resets */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        html, body { height: 100%; width: 100%; background-color: var(--bg-color); color: var(--text-main); overflow: hidden; }

        /* Layout Architecture */
        #app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        
        /* Top Header */
        #app-header {
            height: 60px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }
        .header-title { font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .header-title i { color: var(--accent); }
        .header-stats { font-size: 0.85rem; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 20px; }

        /* Main Workspace */
        #workspace { display: flex; flex: 1; height: calc(100vh - 60px); position: relative; }

        /* Collapsible Sidebar */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            overflow-y: auto;
        }
        #sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }
        
        /* Sidebar Content */
        .sidebar-section { padding: 20px; border-bottom: 1px solid var(--glass-border); }
        .sidebar-section h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 15px; }
        
        /* Custom Layer Controls */
        .layer-group { margin-bottom: 20px; }
        .layer-group-title { font-size: 0.9rem; font-weight: 600; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 8px;}
        .layer-item { display: flex; flex-direction: column; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--glass-border); }
